<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Rovo AI Documentation Knowledge System</title>
  <desc id="desc">A Jira and Rovo AI knowledge system showing documentation pages connected to an agent hub and sub-agents.</desc>
  <defs>
